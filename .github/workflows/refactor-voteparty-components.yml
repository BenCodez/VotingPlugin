name: Split VoteParty components

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/voteparty-components
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Delegate VoteParty state and rewards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_method(text, marker, replacement):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('method marker not found: ' + marker)
              brace = text.find('{', start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == '{': depth += 1
                  elif text[pos] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement + text[pos + 1:]
              raise SystemExit('unterminated method: ' + marker)

          path = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java')
          text = path.read_text()

          # Remove generated boilerplate and imports now owned by reward/state components.
          text = text.replace('// TODO: Auto-generated Javadoc\n/**\n * The Class VoteParty.\n */\n', '/** Coordinates VoteParty voting, reminders, commands, and reset events. */\n')
          for line in [
              'import java.util.Random;\n', 'import java.util.UUID;\n',
              'import java.util.concurrent.ThreadLocalRandom;\n',
              'import com.bencodez.advancedcore.api.rewards.RewardBuilder;\n',
              'import com.bencodez.advancedcore.api.user.UserDataFetchMode;\n',
              'import com.bencodez.simpleapi.sql.DataType;\n',
          ]:
              text = text.replace(line, '')

          field = '\tprivate VotingPluginMain plugin;\n'
          text = text.replace(field, field + '\tprivate final VotePartyState state;\n\tprivate final VotePartyRewardHandler rewardHandler;\n', 1)
          ctor = '\t\tthis.plugin = plugin;\n'
          text = text.replace(ctor, ctor + '\t\tthis.state = new VotePartyState(plugin);\n\t\tthis.rewardHandler = new VotePartyRewardHandler(plugin, state);\n', 1)

          text = replace_method(text, '\tpublic void addTotal(VotingPluginUser user)',
              '\tpublic void addTotal(VotingPluginUser user) {\n\t\tstate.setTotalVotes(state.getTotalVotes() + 1);\n\t\tuser.setVotePartyVotes(user.getVotePartyVotes() + 1);\n\t\tplugin.getPlaceholders().onVotePartyUpdate();\n\t}\n')
          text = replace_method(text, '\tpublic void addVotePlayer(VotingPluginUser user)',
              '\tpublic void addVotePlayer(VotingPluginUser user) {\n\t\tString uuid = user.getUUID();\n\t\tList<String> voted = state.getVotedUsers();\n\t\tif (!voted.contains(uuid)) {\n\t\t\tvoted.add(uuid);\n\t\t\tstate.setVotedUsers(voted);\n\t\t}\n\t}\n')
          text = replace_method(text, '\tpublic int getNeededVotes()',
              '\tpublic int getNeededVotes() {\n\t\treturn state.getNeededVotes();\n\t}\n')
          text = replace_method(text, '\tpublic String getRandomPlayerName()',
              '\tpublic String getRandomPlayerName() {\n\t\treturn rewardHandler.randomOnlinePlayerName();\n\t}\n')
          text = replace_method(text, '\tpublic int getTotalVotes()',
              '\tpublic int getTotalVotes() {\n\t\treturn state.getTotalVotes();\n\t}\n')
          text = replace_method(text, '\tpublic List<String> getVotedUsers()',
              '\tpublic List<String> getVotedUsers() {\n\t\treturn state.getVotedUsers();\n\t}\n')
          text = replace_method(text, '\tpublic int getVotesRequired()',
              '\tpublic int getVotesRequired() {\n\t\treturn state.getVotesRequired();\n\t}\n')
          text = replace_method(text, '\tpublic void giveReward(VotingPluginUser user, boolean useBungee)',
              '\tpublic void giveReward(VotingPluginUser user, boolean useBungee) {\n\t\trewardHandler.giveReward(user, useBungee);\n\t}\n')
          text = replace_method(text, '\tpublic void giveReward(VotingPluginUser user, boolean online, boolean useBungee)',
              '\tpublic void giveReward(VotingPluginUser user, boolean online, boolean useBungee) {\n\t\trewardHandler.giveReward(user, online, useBungee);\n\t}\n')
          text = replace_method(text, '\tpublic void giveRewards(VotingPluginUser orgUser, boolean forceBungee)',
              '\tpublic void giveRewards(VotingPluginUser orgUser, boolean forceBungee) {\n\t\trewardHandler.giveRewards(orgUser, forceBungee);\n\t\treset(false);\n\t}\n')
          text = replace_method(text, '\tpublic void reset(boolean override)',
              '\tpublic void reset(boolean override) {\n\t\tstate.reset(override);\n\t}\n')
          text = replace_method(text, '\tpublic void resetVotePartyCount()',
              '\tpublic void resetVotePartyCount() {\n\t\tstate.resetUserCounts();\n\t}\n')
          text = replace_method(text, '\tpublic void setTotalVotes(int value)',
              '\tpublic void setTotalVotes(int value) {\n\t\tstate.setTotalVotes(value);\n\t}\n')
          text = replace_method(text, '\tpublic void setVotedUsers(List<String> value)',
              '\tpublic void setVotedUsers(List<String> value) {\n\t\tstate.setVotedUsers(value);\n\t}\n')

          path.write_text(text)
          PY
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit VoteParty refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A VotingPlugin
          git commit -m 'Split VoteParty state and reward handling'
          git push origin HEAD:refactor/voteparty-components
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/voteparty-components
          git rm .github/workflows/refactor-voteparty-components.yml
          git commit -m 'Remove temporary VoteParty refactor workflow'
          git push origin HEAD:refactor/voteparty-components
