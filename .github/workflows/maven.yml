name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Build the corrected SQL lifecycle dependencies until their published snapshots catch up.
      - name: Check out SimpleAPI SQL lifecycle dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: BenCodez/SimpleAPI
          ref: fdbf26eec885ec3f1c1dbd937a243a0acfaa0a5e
          path: .ci/simpleapi
          persist-credentials: false
      - name: Build and install SimpleAPI dependency
        run: mvn -B -f .ci/simpleapi/SimpleAPI/pom.xml clean install
      - name: Check out AdvancedCore SQL lifecycle dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: BenCodez/AdvancedCore
          ref: a68cc2dfe6e44c1c0854e659c614708492fcd58d
          path: .ci/advancedcore
          persist-credentials: false
      - name: Build and install AdvancedCore dependency
        run: mvn -B -nsu -f .ci/advancedcore/AdvancedCore/pom.xml clean install
      - name: Build with Maven
        run: mvn -B -nsu -f VotingPlugin/pom.xml package

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Submit dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          directory: VotingPlugin
