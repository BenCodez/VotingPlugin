# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write   # required for dependency submission

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Apply disabled vote-site implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'tests/disabled-vote-site-autocreation'
        shell: python
        run: |
          from pathlib import Path

          CONFIG = Path("VotingPlugin/src/main/java/com/bencodez/votingplugin/config/ConfigVoteSites.java")
          MANAGER = Path("VotingPlugin/src/main/java/com/bencodez/votingplugin/votesites/VoteSiteManager.java")
          VOTIFIER = Path("VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/VotiferEvent.java")

          def replace_once(path: Path, old: str, new: str) -> None:
              raw = path.read_bytes()
              newline = "\r\n" if b"\r\n" in raw else "\n"
              text = raw.decode("utf-8").replace("\r\n", "\n")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}")
              text = text.replace(old, new, 1)
              path.write_bytes(text.replace("\n", newline).encode("utf-8"))

          config_marker = (
              "\t/**\n"
              "\t * Gets the names of vote sites.\n"
              "\t *\n"
              "\t * @param checkEnabled whether to check if sites are enabled\n"
              "\t * @return the list of vote site names\n"
              "\t */\n"
              "\tpublic ArrayList<String> getVoteSitesNames(boolean checkEnabled) {"
          )
          config_method = (
              "\t/**\n"
              "\t * Gets configured vote-site section keys without filtering by Enabled or\n"
              "\t * validating the site's settings.\n"
              "\t *\n"
              "\t * @return the configured vote-site section keys\n"
              "\t */\n"
              "\tpublic ArrayList<String> getRawVoteSiteNames() {\n"
              "\t\tArrayList<String> siteNames = new ArrayList<>();\n"
              "\n"
              "\t\tif (!getData().isConfigurationSection(\"VoteSites\")) {\n"
              "\t\t\treturn siteNames;\n"
              "\t\t}\n"
              "\n"
              "\t\tsiteNames = ArrayUtils.convert(getData().getConfigurationSection(\"VoteSites\").getKeys(false));\n"
              "\t\tsiteNames.removeIf(siteName -> !getData().isConfigurationSection(\"VoteSites.\" + siteName));\n"
              "\t\treturn siteNames;\n"
              "\t}\n"
              "\n"
          )
          replace_once(CONFIG, config_marker, config_method + config_marker)

          manager_doc_marker = (
              "\t/**\n"
              "\t * Attempts to map a URL, display name, or key to the configured vote site key."
          )
          manager_helpers = (
              "\t/**\n"
              "\t * Resolves identifiers against every configured vote-site section, including\n"
              "\t * disabled sites.\n"
              "\t *\n"
              "\t * @param identifiers vote-site keys, service sites, or display names\n"
              "\t * @return the configured vote-site key, or null when no configuration matches\n"
              "\t */\n"
              "\tprivate String getConfiguredVoteSiteName(String... identifiers) {\n"
              "\t\tif (identifiers == null) {\n"
              "\t\t\treturn null;\n"
              "\t\t}\n"
              "\n"
              "\t\tArrayList<String> configuredSites = plugin.getConfigVoteSites().getRawVoteSiteNames();\n"
              "\t\tif (configuredSites == null || configuredSites.isEmpty()) {\n"
              "\t\t\treturn null;\n"
              "\t\t}\n"
              "\n"
              "\t\tfor (String identifier : identifiers) {\n"
              "\t\t\tif (identifier == null || identifier.isEmpty()) {\n"
              "\t\t\t\tcontinue;\n"
              "\t\t\t}\n"
              "\n"
              "\t\t\tString normalizedIdentifier = normalizeVoteSiteKey(identifier);\n"
              "\t\t\tfor (String siteName : configuredSites) {\n"
              "\t\t\t\tif (siteName == null) {\n"
              "\t\t\t\t\tcontinue;\n"
              "\t\t\t\t}\n"
              "\n"
              "\t\t\t\tString serviceSite = plugin.getConfigVoteSites().getServiceSite(siteName);\n"
              "\t\t\t\tString displayName = plugin.getConfigVoteSites().getDisplayName(siteName);\n"
              "\t\t\t\tif (siteName.equalsIgnoreCase(identifier) || siteName.equalsIgnoreCase(normalizedIdentifier)\n"
              "\t\t\t\t\t\t|| (serviceSite != null && !serviceSite.isEmpty()\n"
              "\t\t\t\t\t\t\t\t&& serviceSite.equalsIgnoreCase(identifier))\n"
              "\t\t\t\t\t\t|| (displayName != null && !displayName.isEmpty()\n"
              "\t\t\t\t\t\t\t\t&& displayName.equalsIgnoreCase(identifier))) {\n"
              "\t\t\t\t\treturn siteName;\n"
              "\t\t\t\t}\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\n"
              "\t\treturn null;\n"
              "\t}\n"
              "\n"
              "\t/**\n"
              "\t * Checks whether an identifier belongs to any configured vote site, including\n"
              "\t * a disabled site.\n"
              "\t *\n"
              "\t * @param identifiers vote-site identifiers\n"
              "\t * @return true when a configured vote-site section matches\n"
              "\t */\n"
              "\tpublic boolean hasConfiguredVoteSite(String... identifiers) {\n"
              "\t\treturn getConfiguredVoteSiteName(identifiers) != null;\n"
              "\t}\n"
              "\n"
          )
          replace_once(MANAGER, manager_doc_marker, manager_helpers + manager_doc_marker)

          signature = "\tpublic String getVoteSiteName(boolean checkEnabled, String... urls) {\n"
          signature_with_guard = (
              signature
              + "\t\tif (urls == null) {\n"
              + "\t\t\treturn null;\n"
              + "\t\t}\n"
              + "\n"
          )
          replace_once(MANAGER, signature, signature_with_guard)

          fallback = (
              "\t\tfor (String url : urls) {\n"
              "\t\t\treturn url;\n"
              "\t\t}\n"
              "\n"
              "\t\treturn \"\";\n"
              "\t}\n"
              "\n"
              "\t/**\n"
              "\t * Resolves a VoteSite from an identifier."
          )
          fallback_with_config = (
              "\t\tif (!checkEnabled) {\n"
              "\t\t\tString configuredSiteName = getConfiguredVoteSiteName(urls);\n"
              "\t\t\tif (configuredSiteName != null) {\n"
              "\t\t\t\treturn configuredSiteName;\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\n"
              + fallback
          )
          replace_once(MANAGER, fallback, fallback_with_config)

          replace_once(
              MANAGER,
              "\t\tif (plugin.getConfigFile().isAutoCreateVoteSites() && !hasVoteSite(siteName)) {",
              "\t\tif (plugin.getConfigFile().isAutoCreateVoteSites() && !hasVoteSite(siteName)\n"
              "\t\t\t\t&& !hasConfiguredVoteSite(siteName)) {",
          )

          has_site = (
              "\tpublic boolean hasVoteSite(String site) {\n"
              "\t\tString siteName = getVoteSiteName(false, site);\n"
              "\n"
              "\t\tfor (VoteSite voteSite : getVoteSites()) {"
          )
          has_site_with_guard = (
              "\tpublic boolean hasVoteSite(String site) {\n"
              "\t\tString siteName = getVoteSiteName(false, site);\n"
              "\t\tif (siteName == null) {\n"
              "\t\t\treturn false;\n"
              "\t\t}\n"
              "\n"
              "\t\tfor (VoteSite voteSite : getVoteSites()) {"
          )
          replace_once(MANAGER, has_site, has_site_with_guard)

          replace_once(
              VOTIFIER,
              "\t\t\t\t\tboolean createSite = !plugin.getVoteSiteManager().hasVoteSite(voteSiteNameStr);",
              "\t\t\t\t\tboolean createSite = !plugin.getVoteSiteManager().hasVoteSite(voteSiteNameStr)\n"
              "\t\t\t\t\t\t\t&& !plugin.getVoteSiteManager().hasConfiguredVoteSite(voteSiteNameStr);",
          )

          for path in (CONFIG, MANAGER, VOTIFIER):
              text = path.read_text(encoding="utf-8")
              if "getRawVoteSiteNames" not in text and path == CONFIG:
                  raise RuntimeError("ConfigVoteSites implementation was not applied")
              if "hasConfiguredVoteSite" not in text and path in (MANAGER, VOTIFIER):
                  raise RuntimeError(f"Configured-site guard was not applied to {path}")

          # Restore the normal workflow in the commit produced after verification.
          import subprocess
          subprocess.run(["git", "fetch", "origin", "master", "--depth=1"], check=True)
          normal_workflow = subprocess.check_output(
              ["git", "show", "origin/master:.github/workflows/maven.yml"]
          )
          Path(".github/workflows/maven.yml").write_bytes(normal_workflow)

      - name: Build with Maven
        run: mvn -B -f VotingPlugin/pom.xml package

      - name: Commit verified disabled vote-site fix
        if: github.event_name == 'pull_request' && github.head_ref == 'tests/disabled-vote-site-autocreation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/maven.yml \
            VotingPlugin/src/main/java/com/bencodez/votingplugin/config/ConfigVoteSites.java \
            VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/VotiferEvent.java \
            VotingPlugin/src/main/java/com/bencodez/votingplugin/votesites/VoteSiteManager.java

          git diff --cached --check

          actual_paths="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/maven.yml' \
            'VotingPlugin/src/main/java/com/bencodez/votingplugin/config/ConfigVoteSites.java' \
            'VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/VotiferEvent.java' \
            'VotingPlugin/src/main/java/com/bencodez/votingplugin/votesites/VoteSiteManager.java' \
            | LC_ALL=C sort)"

          if [[ "${actual_paths}" != "${expected_paths}" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${actual_paths}" >&2
            exit 1
          fi

          git commit -m "Prevent disabled vote sites from being auto-created"
          git push origin HEAD:tests/disabled-vote-site-autocreation

      # Only submit dependency snapshot on push (not on pull_request)
      - name: Submit Dependency Snapshot
        if: github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@v5
        with:
          directory: VotingPlugin   # path to pom.xml
          # optional: maven-args: "-DskipTests"
