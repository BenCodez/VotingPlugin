name: Preserve comment cleanup line endings

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/generated-comments-round2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reapply cleanup preserving line endings
        run: |
          git fetch origin refactor/voteparty-components
          git checkout origin/refactor/voteparty-components -- VotingPlugin/src/main/java
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('VotingPlugin/src/main/java')
          for path in root.rglob('*.java'):
              data = path.read_bytes()
              original = data
              data = re.sub(rb'(?m)^[ \t]*// TODO: Auto-generated Javadoc[ \t]*\r?\n', b'', data)
              data = re.sub(rb'(?ms)^[ \t]*/\*\*[ \t]*\r?\n[ \t]*\* The Class [^\r\n]+\.[ \t]*\r?\n[ \t]*\*/[ \t]*\r?\n', b'', data)
              data = re.sub(rb'(?ms)^[ \t]*/\*[ \t]*\r?\n[ \t]*\* \(non-Javadoc\).*?\*/[ \t]*\r?\n', b'', data)
              if data != original:
                  path.write_bytes(data)
          PY
          if grep -R --line-number --include='*.java' 'TODO: Auto-generated Javadoc\|(non-Javadoc)' VotingPlugin/src/main/java; then
            exit 1
          fi
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit clean diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A VotingPlugin/src/main/java
          git commit -m 'Preserve line endings in comment cleanup'
          git push origin HEAD:cleanup/generated-comments-round2
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin cleanup/generated-comments-round2
          git rm .github/workflows/preserve-comment-cleanup-line-endings.yml
          git commit -m 'Remove temporary line ending cleanup workflow'
          git push origin HEAD:cleanup/generated-comments-round2
