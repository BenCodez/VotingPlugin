name: Fix VoteParty review feedback

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/voteparty-components
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Wire coordinator reward hook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java')
          text = path.read_text()
          old = 'this.rewardHandler = new VotePartyRewardHandler(plugin, state);'
          new = 'this.rewardHandler = new VotePartyRewardHandler(plugin, state, this);'
          if old not in text:
              raise SystemExit('VoteParty constructor anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java
          git commit -m 'Preserve VoteParty reward override hooks'
          git push origin HEAD:refactor/voteparty-components
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/voteparty-components
          git rm .github/workflows/fix-voteparty-review.yml
          git commit -m 'Remove temporary VoteParty review workflow'
          git push origin HEAD:refactor/voteparty-components
