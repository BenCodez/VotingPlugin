name: Fix VoteParty override hooks

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/voteparty-components
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore public VoteParty hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          vote_party = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java')
          text = vote_party.read_text()
          text = text.replace('state.setTotalVotes(state.getTotalVotes() + 1);', 'setTotalVotes(getTotalVotes() + 1);')
          text = text.replace('List<String> voted = state.getVotedUsers();', 'List<String> voted = getVotedUsers();')
          text = text.replace('state.setVotedUsers(voted);', 'setVotedUsers(voted);')
          text = text.replace('return state.getNeededVotes();', 'return getVotesRequired() - getTotalVotes();')
          old_reset = '''\tpublic void reset(boolean override) {\n\t\tstate.reset(override);\n\t}\n'''
          new_reset = '''\tpublic void reset(boolean override) {\n\t\tif (override) {\n\t\t\tsetTotalVotes(0);\n\t\t}\n\t\tsetVotedUsers(new ArrayList<>());\n\t\tresetVotePartyCount();\n\t}\n'''
          if old_reset not in text:
              raise SystemExit('VoteParty reset block not found')
          text = text.replace(old_reset, new_reset)
          vote_party.write_text(text)

          handler = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VotePartyRewardHandler.java')
          text = handler.read_text()
          text = text.replace('dispatchGlobalCommands(randomOnlinePlayerName());', 'dispatchGlobalCommands(voteParty.getRandomPlayerName());')
          text = text.replace('ArrayUtils.makeStringList(state.getVotedUsers())', 'ArrayUtils.makeStringList(voteParty.getVotedUsers())')
          text = text.replace('for (String uuid : state.getVotedUsers()) {', 'for (String uuid : voteParty.getVotedUsers()) {')
          handler.write_text(text)
          PY
      - name: Verify hooks
        run: |
          grep -F 'setTotalVotes(getTotalVotes() + 1);' VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java
          grep -F 'List<String> voted = getVotedUsers();' VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java
          grep -F 'dispatchGlobalCommands(voteParty.getRandomPlayerName());' VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VotePartyRewardHandler.java
          grep -F 'for (String uuid : voteParty.getVotedUsers()) {' VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VotePartyRewardHandler.java
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VoteParty.java VotingPlugin/src/main/java/com/bencodez/votingplugin/specialrewards/voteparty/VotePartyRewardHandler.java
          git commit -m 'Preserve VoteParty override hooks'
          git push origin HEAD:refactor/voteparty-components
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/voteparty-components
          git rm .github/workflows/fix-voteparty-override-hooks.yml
          git commit -m 'Remove temporary VoteParty hook workflow'
          git push origin HEAD:refactor/voteparty-components
