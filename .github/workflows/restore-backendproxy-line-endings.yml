name: Restore backendproxy refactor line endings

on:
  push:
    branches:
      - refactor/backendproxy-presence

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/backendproxy-presence
      - name: Restore CRLF on legacy files
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/PlayerJoinEvent.java'),
              Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/VotiferEvent.java'),
              Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/placeholders/PlaceHolders.java'),
          ]
          for path in files:
              text = path.read_text()
              normalized = text.replace('\r\n', '\n').replace('\r', '\n')
              path.write_bytes(normalized.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Commit restored line endings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/PlayerJoinEvent.java \
                  VotingPlugin/src/main/java/com/bencodez/votingplugin/listeners/VotiferEvent.java \
                  VotingPlugin/src/main/java/com/bencodez/votingplugin/placeholders/PlaceHolders.java
          git commit -m 'Restore legacy line endings after handler rename'
          git push origin HEAD:refactor/backendproxy-presence
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/backendproxy-presence
          git rm .github/workflows/restore-backendproxy-line-endings.yml
          git commit -m 'Remove temporary line-ending workflow'
          git push origin HEAD:refactor/backendproxy-presence
