name: Refactor backend proxy components

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/backendproxy-components
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Replace directly-defined reward orchestration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/VotingPluginMain.java')
          text = path.read_text()

          imports = {
              'import com.bencodez.votingplugin.backendproxy.BackendProxyHandler;\n': 'import com.bencodez.votingplugin.backendproxy.BackendProxyHandler;\nimport com.bencodez.votingplugin.backendproxy.BackendProxyRewardRegistrar;\n',
              'import com.bencodez.votingplugin.specialrewards.SpecialRewards;\n': 'import com.bencodez.votingplugin.specialrewards.SpecialRewards;\nimport com.bencodez.votingplugin.specialrewards.SpecialRewardsRewardRegistrar;\n',
              'import com.bencodez.votingplugin.specialrewards.votemilestones.VoteMilestonesManager;\n': 'import com.bencodez.votingplugin.specialrewards.votemilestones.VoteMilestoneRewardRegistrar;\nimport com.bencodez.votingplugin.specialrewards.votemilestones.VoteMilestonesManager;\n',
              'import com.bencodez.votingplugin.specialrewards.voteparty.VoteParty;\n': 'import com.bencodez.votingplugin.specialrewards.voteparty.VoteParty;\nimport com.bencodez.votingplugin.specialrewards.voteparty.VotePartyRewardRegistrar;\n',
              'import com.bencodez.votingplugin.specialrewards.votestreak.VoteStreakHandler;\n': 'import com.bencodez.votingplugin.specialrewards.votestreak.VoteStreakHandler;\nimport com.bencodez.votingplugin.specialrewards.votestreak.VoteStreakRewardRegistrar;\n',
              'import com.bencodez.votingplugin.topvoter.TopVoterState;\n': 'import com.bencodez.votingplugin.topvoter.TopVoterState;\nimport com.bencodez.votingplugin.topvoter.TopVoterRewardRegistrar;\n',
              'import com.bencodez.votingplugin.votereminding.VoteRemindersManager;\n': 'import com.bencodez.votingplugin.votereminding.VoteReminderRewardRegistrar;\nimport com.bencodez.votingplugin.votereminding.VoteRemindersManager;\n',
              'import com.bencodez.votingplugin.voteshop.VoteShopManager;\n': 'import com.bencodez.votingplugin.voteshop.VoteShopManager;\nimport com.bencodez.votingplugin.voteshop.VoteShopRewardRegistrar;\n',
              'import com.bencodez.votingplugin.votesites.VoteSiteManager;\n': 'import com.bencodez.votingplugin.votesites.VoteSiteManager;\nimport com.bencodez.votingplugin.votesites.VoteSiteRewardRegistrar;\n',
          }
          for old, new in imports.items():
              if new not in text:
                  if old not in text:
                      raise SystemExit('import anchor not found: ' + old.strip())
                  text = text.replace(old, new, 1)

          start_marker = '\tprivate void addSpecialRewardsEditorPath(String rewardPath) {'
          end_marker = '\n\tprivate void loadTimer() {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('directly-defined block markers not found')

          replacement = '''\tpublic void loadDirectlyDefined() {\n\t\tgetRewardHandler().getDirectlyDefinedRewards().clear();\n\n\t\tVoteReminderRewardRegistrar.register(this);\n\t\tSpecialRewardsRewardRegistrar.register(this);\n\t\tVoteSiteRewardRegistrar.register(this);\n\t\tVotePartyRewardRegistrar.register(this);\n\t\tVoteMilestoneRewardRegistrar.register(this);\n\t\tVoteStreakRewardRegistrar.register(this);\n\t\tTopVoterRewardRegistrar.register(this);\n\t\tVoteShopRewardRegistrar.register(this);\n\t\tBackendProxyRewardRegistrar.register(this);\n\n\t\tgetRewardHandler().checkDirectlyDefined();\n\t}\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A VotingPlugin
          git commit -m 'Split backend proxy components and reward path ownership'
          git push origin HEAD:refactor/backendproxy-components
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/backendproxy-components
          git rm .github/workflows/refactor-backendproxy-components.yml
          git commit -m 'Remove temporary refactor workflow'
          git push origin HEAD:refactor/backendproxy-components
