name: Refactor top voter handler

on:
  pull_request:
    branches:
      - refactor/votingplugin-reward-registration
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/topvoter-handler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Split top voter loading and ranking
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_method(text, marker, replacement):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('method marker not found: ' + marker)
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit('method brace not found: ' + marker)
              depth = 0
              pos = brace
              while pos < len(text):
                  if text[pos] == '{':
                      depth += 1
                  elif text[pos] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement + text[pos + 1:]
                  pos += 1
              raise SystemExit('unterminated method: ' + marker)

          handler = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/topvoter/TopVoterHandler.java')
          text = handler.read_text()
          field_anchor = '\tprivate VotingPluginMain plugin;\n'
          if '\tprivate final TopVoterLoader loader;\n' not in text:
              text = text.replace(field_anchor, field_anchor + '\tprivate final TopVoterLoader loader;\n', 1)
          ctor_anchor = '\t\tthis.plugin = plugin;\n'
          if '\t\tthis.loader = new TopVoterLoader(plugin);\n' not in text:
              text = text.replace(ctor_anchor, ctor_anchor + '\t\tthis.loader = new TopVoterLoader(plugin);\n', 1)

          text = replace_method(text,
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> getMonthlyTopVotersAtTime(LocalDateTime atTime)',
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> getMonthlyTopVotersAtTime(LocalDateTime atTime) {\n\t\treturn loader.getMonthlyTopVotersAtTime(atTime);\n\t}\n')
          text = replace_method(text,
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> getTopVotersOfMonth(YearMonth month,',
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> getTopVotersOfMonth(YearMonth month,\n\t\t\tHashMap<UUID, ArrayList<Column>> cols) {\n\t\treturn loader.getTopVotersOfMonth(month, cols);\n\t}\n')
          text = replace_method(text, '\tpublic void loadLastMonth()',
              '\tpublic void loadLastMonth() {\n\t\tloader.loadLastMonth();\n\t}\n')
          text = replace_method(text, '\tpublic void loadPreviousMonthTopVoters()',
              '\tpublic void loadPreviousMonthTopVoters() {\n\t\tloader.loadPreviousMonthTopVoters();\n\t}\n')
          text = replace_method(text, '\tprivate HashMap<Integer, String> handlePlaces(Set<String> places)',
              '\tprivate HashMap<Integer, String> handlePlaces(Set<String> places) {\n\t\treturn TopVoterRanking.mapAwardPlaces(places);\n\t}\n')
          text = replace_method(text,
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> sortByValues(LinkedHashMap<TopVoterPlayer, Integer> map,',
              '\tpublic LinkedHashMap<TopVoterPlayer, Integer> sortByValues(LinkedHashMap<TopVoterPlayer, Integer> map,\n\t\t\tfinal boolean order) {\n\t\treturn TopVoterRanking.sortByValues(map, order);\n\t}\n')
          text = text.replace('ArrayList<TopVoterPlayer> users = plugin.convertSet(plugin.getTopVoter(TopVoter.Weekly).keySet());',
                              'ArrayList<TopVoterPlayer> users = new ArrayList<>(plugin.getTopVoterState().getTopVoters(TopVoter.Weekly).keySet());')
          handler.write_text(text)

          main = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/VotingPluginMain.java')
          main_text = main.read_text()
          main_text = replace_method(main_text, '\tpublic ArrayList<TopVoterPlayer> convertSet(Set<TopVoterPlayer> set)', '')
          main_text = replace_method(main_text, '\tpublic void checkFirstTimeLoaded()', '')
          main_text = main_text.replace('\n\tprivate boolean firstTimeLoaded = false;\n', '\n')
          main.write_text(main_text)
          PY
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A VotingPlugin
          git commit -m 'Split top voter loading and ranking'
          git push origin HEAD:refactor/topvoter-handler
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin refactor/topvoter-handler
          git rm .github/workflows/refactor-topvoter-handler.yml
          git commit -m 'Remove temporary top voter refactor workflow'
          git push origin HEAD:refactor/topvoter-handler
