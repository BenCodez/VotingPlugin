name: Investigate issue without posting

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
      timeout_minutes:
        default: '15'
        type: string
      openai_project_id:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
    outputs:
      outcome:
        value: ${{ github.run_attempt != '1' && 'skipped' || jobs.investigate.outputs.outcome || jobs.admit.outputs.outcome }}
      artifact_id:
        value: ${{ github.run_attempt == '1' && jobs.investigate.outputs.artifact_id || '' }}
      revision:
        value: ${{ github.run_attempt == '1' && jobs.investigate.outputs.revision || '' }}
      source_sha:
        value: ${{ github.run_attempt == '1' && jobs.investigate.outputs.source_sha || '' }}
      engine_sha:
        value: ${{ github.run_attempt == '1' && jobs.investigate.outputs.engine_sha || '' }}

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      outcome: ${{ steps.admission.outputs.outcome }}
      engine_sha: ${{ steps.admission.outputs.engine_sha }}
      issue_number: ${{ steps.admission.outputs.issue_number }}
    steps:
      - name: Verify caller and resolve immutable engine identity
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_ISSUE: ${{ inputs.issue_number }}
          SELECTED_TIMEOUT: ${{ inputs.timeout_minutes }}
          SELECTED_PROJECT: ${{ inputs.openai_project_id }}
          POLICY_URL: ${{ vars.ISSUE_INVESTIGATION_POLICY_URL }}
          POLICY_SHA: ${{ vars.ISSUE_INVESTIGATION_DISCLOSURE_SHA256 }}
        shell: python
        run: |
          # This bootstrap runs before any repository checkout or model secret use.
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          from urllib.parse import urlencode, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          CALLERS = {'BenCodez/AdvancedCore': (66120957, 'master'),
                     'BenCodez/SimpleAPI': (796949127, 'main')}
          ENGINE_WORKFLOW = 'BenCodez/VotingPlugin/.github/workflows/investigate-issue-reusable.yml@'

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def admission(env, event, fetch, day):
              repository = env['GITHUB_REPOSITORY']
              require(repository in CALLERS, 'Unsupported caller')
              repo_id, branch = CALLERS[repository]
              sha = env['GITHUB_SHA']
              run_id = env['GITHUB_RUN_ID']
              attempt = env['GITHUB_RUN_ATTEMPT']
              kind = env['GITHUB_EVENT_NAME']
              number = env['SELECTED_ISSUE']
              minutes = env['SELECTED_TIMEOUT']
              require(env['GITHUB_REPOSITORY_ID'] == str(repo_id)
                      and env['GITHUB_REF'] == 'refs/heads/' + branch
                      and env['GITHUB_WORKFLOW_REF'] ==
                          f'{repository}/.github/workflows/investigate-issue.yml@refs/heads/{branch}'
                      and re.fullmatch(r'[0-9a-f]{40}', sha)
                      and re.fullmatch(r'[1-9][0-9]{0,19}', run_id)
                      and re.fullmatch(r'[1-9][0-9]{0,8}', attempt)
                      and kind in {'issues', 'workflow_dispatch'}, 'Invalid caller run identity')
              source = event.get('repository') or {}
              require(source.get('id') == repo_id and source.get('full_name') == repository
                      and source.get('default_branch') == branch and source.get('fork') is False
                      and source.get('private') is False, 'Unexpected caller repository')
              require(re.fullmatch(r'[1-9][0-9]{0,8}', number)
                      and re.fullmatch(r'[0-9]{1,2}', minutes) and 5 <= int(minutes) <= 30
                      and re.fullmatch(r'proj_[A-Za-z0-9]{8,80}', env['SELECTED_PROJECT']),
                      'Invalid caller inputs')
              if kind == 'issues':
                  issue = event.get('issue') or {}
                  require(event.get('action') == 'opened' and 'pull_request' not in issue
                          and type(issue.get('number')) is int and str(issue['number']) == number,
                          'Event issue does not match selected issue')
                  for actor in (event.get('sender') or {}, issue.get('user') or {}):
                      require(actor.get('type') == 'User' and isinstance(actor.get('login'), str)
                              and not actor['login'].lower().endswith('[bot]'),
                              'Bot or unknown issue actor')
              else:
                  require((event.get('inputs') or {}).get('issue_number') == number,
                          'Manual issue number does not match native dispatch')
              path = f'/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}'
              run = fetch(path)
              workflow_id = run.get('workflow_id')
              require(run.get('id') == int(run_id) and run.get('run_attempt') == int(attempt)
                      and run.get('head_sha') == sha and run.get('head_branch') == branch
                      and run.get('event') == kind and (run.get('repository') or {}).get('id') == repo_id
                      and (run.get('head_repository') or {}).get('id') == repo_id
                      and type(workflow_id) is int and workflow_id > 0, 'Actions run identity mismatch')
              references = run.get('referenced_workflows')
              require(isinstance(references, list), 'Actions engine provenance unavailable')
              matches = [row for row in references if isinstance(row, dict)
                         and isinstance(row.get('path'), str) and row['path'].startswith(ENGINE_WORKFLOW)]
              require(len(matches) == 1, 'Actions engine reference is missing or ambiguous')
              engine_sha = matches[0].get('sha')
              require(isinstance(engine_sha, str) and re.fullmatch(r'[0-9a-f]{40}', engine_sha)
                      and matches[0]['path'] == ENGINE_WORKFLOW + engine_sha,
                      'Engine workflow must be pinned to the resolved full commit')

              # A job rerun must never reopen an ambiguous billable dispatch.
              if attempt != '1':
                  return {'outcome': 'skipped'}
              endpoint = urlsplit(env.get('POLICY_URL', ''))
              require(endpoint.scheme == 'https' and endpoint.hostname and not endpoint.username
                      and not endpoint.password and not endpoint.fragment
                      and re.fullmatch(r'[0-9a-f]{64}', env.get('POLICY_SHA', '')),
                      'Approved exact-disclosure policy is unavailable')
              if kind == 'issues':
                  query = urlencode({'event': 'issues', 'created': day + '..' + day, 'per_page': 1})
                  runs = fetch(f'/repos/{repository}/actions/workflows/{workflow_id}/runs?' + query)
                  count = runs.get('total_count')
                  require(type(count) is int and count > 0, 'Automatic run budget could not be verified')
                  if count > 5:
                      return {'outcome': 'skipped'}
              return {'outcome': 'admitted', 'engine_sha': engine_sha, 'issue_number': number}

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def fetch(path):
              request = Request('https://api.github.com' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with build_opener(NoRedirect).open(request, timeout=15) as response:
                  data = response.read(512 * 1024 + 1)
              require(len(data) <= 512 * 1024, 'Actions response exceeded its bound')
              return json.loads(data)

          if __name__ == '__main__':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
              outcome = admission(os.environ, event, fetch, datetime.now(timezone.utc).date().isoformat())
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  for field, value in outcome.items():
                      output.write(f'{field}={value}\n')

  investigate:
    needs: admit
    if: ${{ github.run_attempt == '1' && needs.admit.outputs.outcome == 'admitted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: issue-investigation-${{ github.repository_id }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.receipt.outputs.outcome }}
      artifact_id: ${{ steps.receipt.outputs.artifact_id }}
      revision: ${{ steps.receipt.outputs.revision }}
      source_sha: ${{ steps.receipt.outputs.source_sha }}
      engine_sha: ${{ steps.receipt.outputs.engine_sha }}
    env:
      ISSUE_NUMBER: ${{ needs.admit.outputs.issue_number }}
      ISSUE_INVESTIGATION_ENGINE_SHA: ${{ needs.admit.outputs.engine_sha }}
      ISSUE_INVESTIGATION_DISCLOSURE_SHA256: ${{ vars.ISSUE_INVESTIGATION_DISCLOSURE_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: engine
        with:
          repository: BenCodez/VotingPlugin
          ref: ${{ needs.admit.outputs.engine_sha }}
          persist-credentials: false
      - name: Verify engine checkout and load pinned disclosure policy
        env:
          ISSUE_INVESTIGATION_POLICY_URL: ${{ vars.ISSUE_INVESTIGATION_POLICY_URL }}
          ISSUE_INVESTIGATION_DISCLOSURE_CHECKER: ${{ runner.temp }}/investigator-policy-${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$ISSUE_INVESTIGATION_ENGINE_SHA"
          python3 .github/issue-investigation/run.py --install-policy
          printf 'ISSUE_INVESTIGATION_DISCLOSURE_CHECKER=%s\n' "$ISSUE_INVESTIGATION_DISCLOSURE_CHECKER" >> "$GITHUB_ENV"
      - name: Generate an unreviewed artifact without posting
        timeout-minutes: 43
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT_ID: ${{ inputs.openai_project_id }}
          GH_TOKEN: ${{ github.token }}
          AGENT_TIMEOUT_MINUTES: ${{ github.event_name == 'issues' && '10' || inputs.timeout_minutes }}
          ISSUE_INVESTIGATION_OWNER: github
        run: python3 .github/issue-investigation/run.py --hosted-artifact
      - name: Retry cleanup of the known session
        if: ${{ always() && steps.engine.outcome == 'success' }}
        timeout-minutes: 4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT_ID: ${{ inputs.openai_project_id }}
        run: python3 .github/issue-investigation/run.py --cleanup
      - name: Validate exact artifact bytes
        id: ready
        run: python3 .github/issue-investigation/run.py --prepare-reusable-upload
      - name: Upload checked report
        id: upload
        if: ${{ steps.ready.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            investigation-results/report.md
            investigation-results/completed.json
            investigation-results/evidence.json
            investigation-results/turn.json
            investigation-results/usage.json
            investigation-results/cleanup.json
          retention-days: 14
          if-no-files-found: error
      - name: Emit producer storage receipt
        id: receipt
        env:
          INVESTIGATION_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python3 .github/issue-investigation/run.py --confirm-hosted-upload
