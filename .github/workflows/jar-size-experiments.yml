name: Temporary JAR size experiments

on:
  pull_request:
    paths:
      - '.github/workflows/jar-size-experiments.yml'
      - 'scripts/jar_size_experiments.py'

permissions:
  contents: read

jobs:
  jar-size-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout experiment script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run isolated JAR size experiments
        run: python3 scripts/jar_size_experiments.py
