name: Remove BungeeHandler compatibility

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-bungee-handler
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Remove compatibility API
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/VotingPluginMain.java')
          text = main.read_text()
          block = '''\n\t/**\n\t * @deprecated Use {@link #getBackendProxyHandler()} instead.\n\t */\n\t@Deprecated\n\tpublic BungeeHandler getBungeeHandler() {\n\t\treturn (BungeeHandler) backendProxyHandler;\n\t}\n'''
          if block not in text:
              raise SystemExit('deprecated getBungeeHandler block not found')
          text = text.replace(block, '\n')
          text = text.replace('backendProxyHandler = new BungeeHandler(this);', 'backendProxyHandler = new BackendProxyHandler(this);')
          main.write_text(text)

          files = [
              Path('VotingPlugin/src/main/java/com/bencodez/votingplugin/BungeeHandler.java'),
              Path('VotingPlugin/src/test/java/com/bencodez/votingplugin/tests/backendproxy/BungeeHandlerCompatibilityTest.java'),
              Path('VotingPlugin/src/test/java/com/bencodez/votingplugin/tests/backendproxy/RemoveBungeeHandlerMigrationTest.java'),
          ]
          for path in files:
              if path.name == 'BungeeHandler.java' and not path.exists():
                  raise SystemExit('BungeeHandler.java not found')
              path.unlink(missing_ok=True)
          PY
      - name: Verify legacy symbols are gone
        run: |
          if grep -R --line-number --include='*.java' '\bBungeeHandler\b\|getBungeeHandler()' VotingPlugin/src/main/java VotingPlugin/src/test/java; then
            echo 'Legacy BungeeHandler symbols remain'
            exit 1
          fi
      - name: Build
        run: mvn -B -f VotingPlugin/pom.xml package
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove BungeeHandler compatibility API'
          git push origin HEAD:cleanup/remove-bungee-handler
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin cleanup/remove-bungee-handler
          git rm .github/workflows/remove-bungee-handler.yml
          git commit -m 'Remove temporary refactor workflow'
          git push origin HEAD:cleanup/remove-bungee-handler
